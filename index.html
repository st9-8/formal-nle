*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 18px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-family:Literata,Georgia,serif;font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em}
#stats{color:var(--muted);font-size:13.5px}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--sel);border-color:var(--sel);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit);background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 18px;background:var(--surface);border-bottom:1px solid var(--line);font-size:14px}
#q{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 10px;min-width:200px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;background:transparent;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--surface2);border-color:var(--ink)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.flabel{color:var(--muted);font-size:13px}
select.small{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 8px;font-size:13.5px}
#linkbar{display:none;align-items:center;gap:10px;padding:8px 18px;background:var(--sel);color:#fff;font-size:14px}
#linkbar.show{display:flex}
#linkbar select{background:#fff;color:#222;border:0;border-radius:6px;padding:4px 6px}
#linkbar button{background:transparent;color:#fff;border:1px solid #fff;border-radius:6px;padding:3px 10px;cursor:pointer}
#banner{display:none;gap:10px;align-items:center;padding:8px 18px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:14px}

main{flex:1;display:flex;min-height:0;position:relative}

.edge:not(.rel-contient) line.vis{stroke:var(--edgex);stroke-dasharray:5 4;stroke-width:1.3}
.edge.rel-critique line.vis{stroke:var(--crit)}

.edge.is-sel line.vis,.edge.is-hot line.vis{stroke:var(--sel);stroke-width:2.2}
.node{cursor:pointer}

.node.k-root text{font-family:Literata,Georgia,serif;font-size:17px;font-weight:600}
.node.k-domain text{font-family:Literata,Georgia,serif;font-size:16px;font-weight:600}
.node.k-axis text{font-size:13px;font-weight:700}
.node.k-paper text{font-size:11.5px}
svg.far .node.k-paper text{display:none}
svg.far .node.k-paper.is-sel text,svg.far .node.k-paper.is-hot text,svg.far .node.k-paper.is-match text{display:block}
.node circle.body{stroke-width:2}
.node circle.ring{fill:none;stroke-width:1.4}
.node.verify circle.body{stroke-dasharray:3 2}
.node.is-sel circle.body{stroke:var(--sel)!important;stroke-width:3.5}
.node.is-from circle.body{stroke:var(--sel)!important;stroke-width:4}
.dim{opacity:.13}
#legend{position:absolute;left:14px;bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:5px 9px;align-items:center;max-width:250px}

#zoomctl{position:absolute;right:14px;bottom:14px;display:flex;gap:6px}
#panel{width:380px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px}

#panel h3{font-size:13.5px;color:var(--muted);font-weight:700;margin:20px 0 8px}
#panel p{line-height:1.55;margin:0 0 10px;max-width:62ch}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field label{font-size:12.5px;color:var(--muted)}
.field input[type=text],.field input[type=url],.field select,.field textarea{border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:7px 9px;width:100%}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.row{display:flex;gap:10px}
.row>.field{flex:1}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
.conn{list-style:none;padding:0;margin:0;font-size:14px}
.conn li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.conn li .rel{color:var(--muted);font-size:12.5px;min-width:78px}
.conn li button.go{flex:1;text-align:left;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.conn li button.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tag{display:inline-block;font-size:12px;border-radius:5px;padding:2px 7px;margin:0 5px 5px 0;background:var(--surface2);border:1px solid var(--line)}
.warn{color:var(--crit)}
a{color:inherit}

.ro .editonly{display:none!important}
@media (max-width:820px){main{flex-direction:column}#panel{width:100%;border-left:0;border-top:1px solid var(--line);max-height:46%}#legend{display:none}header h1{font-size:17px}}

esure de couverture.", "rqNote": "Les règles se traduisent facilement en langue naturelle, ce qui convient aux non-experts (RQ3). Baseline de MaNtLE."}, {"id": "x3", "kind": "axis", "domain": "xai", "label": "Contrefactuels et recours", "short": "Contrefactuels et recours", "authors": "", "year": "", "venue": "", "status": "a_lire", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Explications par changements minimaux qui modifient la décision.", "rqNote": "Répondent à « que faudrait-il changer ? » et au recours (RQ2, RQ3)."}, {"id": "wachter", "kind": "paper", "domain": "xai", "label": "Counterfactual Explanations without Opening the Black Box", "short": "Wachter", "authors": "S. Wachter, B. Mittelstadt, C. Russell", "year": "2017", "venue": "Harvard Journal of Law & Technology", "status": "a_lire", "pioneer": true, "verify": false, "rq": ["RQ2"], "note": "", "url": "", "summary": "Définit l’explication contrefactuelle comme le plus petit changement de l’entrée qui modifie la décision, sans ouvrir la boîte noire. Argumentation juridique liée au RGPD.", "rqNote": "Répond à « que faudrait-il changer ? » (RQ2) et rejoint l’argument légal de votre slide 5."}, {"id": "dice", "kind": "paper", "domain": "xai", "label": "Explaining ML Classifiers through Diverse Counterfactual Explanations", "short": "DiCE", "authors": "R. K. Mothilal, A. Sharma, C. Tan", "year": "2020", "venue": "FAT* / FAccT", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ2"], "note": "", "url": "", "summary": "Génère plusieurs contrefactuels diversifiés et réalisables, par optimisation avec termes de proximité et de diversité, et contraintes sur les variables modifiables. Bibliothèque disponible.", "rqNote": "Outil prêt à l’emploi. La diversité permet de proposer une autre option quand l’utilisateur rejette une suggestion (RQ2)."}, {"id": "karimi", "kind": "paper", "domain": "xai", "label": "Algorithmic Recourse: from Counterfactual Explanations to Interventions", "short": "Recours algorithmique", "authors": "A.-H. Karimi, B. Schölkopf, I. Valera", "year": "2021", "venue": "FAccT", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ2", "RQ3"], "note": "", "url": "", "summary": "Montre que des contrefactuels qui ignorent la causalité peuvent donner des recommandations inefficaces, et reformule le recours comme des interventions sur un modèle causal.", "rqNote": "Une explication « actionnable » doit respecter les dépendances causales : critère de fidélité du contenu (RQ3)."}, {"id": "naturalxai", "kind": "paper", "domain": "xai", "label": "Natural XAI: Feasible, Actionable, and Causally-Aware Counterfactual Explanations in Natural Language", "short": "Natural XAI", "authors": "", "year": "2025", "venue": "", "status": "lu", "pioneer": false, "verify": true, "rq": ["RQ2", "RQ3"], "note": "Taxonomie d’actionnabilité (FAT), graphe causal (DECI), NLG à base de templates, raffinement itératif avec l’utilisateur.", "url": "", "summary": "Intègre une taxonomie d’actionnabilité des variables (FAT) et la découverte causale (DECI) dans la génération de contrefactuels, présentés en langue naturelle par templates. Un workflow agentique laisse l’utilisateur affiner les contraintes.", "rqNote": "Les contraintes données par l’utilisateur forment un modèle de l’utilisateur (RQ1). Exemple de NLG contrôlée qui limite les affirmations non étayées (RQ3)."}, {"id": "x4", "kind": "axis", "domain": "xai", "label": "Explications par concepts", "short": "Explications par concepts", "authors": "", "year": "", "venue": "", "status": "a_lire", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Explications en termes de concepts humains plutôt que de variables brutes.", "rqNote": "Utile pour la question « quels concepts comptent ? » de votre slide 6."}, {"id": "tcav", "kind": "paper", "domain": "xai", "label": "Interpretability Beyond Feature Attribution: Testing with Concept Activation Vectors", "short": "TCAV", "authors": "B. Kim et al.", "year": "2018", "venue": "ICML", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ2"], "note": "", "url": "", "summary": "Mesure la sensibilité d’un modèle à un concept humain, défini par des exemples, grâce à des vecteurs d’activation de concept.", "rqNote": "Piste pour « quels concepts comptent ? ». Moins directe pour des données tabulaires."}, {"id": "x5", "kind": "axis", "domain": "xai", "label": "XAI centrée humain et besoins", "short": "XAI centrée humain et besoins", "authors": "", "year": "", "venue": "", "status": "a_lire", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Études empiriques sur les besoins, l’usage et les effets des explications chez les humains.", "rqNote": "Base pour représenter les besoins (RQ1) et pour l’évaluation."}, {"id": "liao", "kind": "paper", "domain": "xai", "label": "Questioning the AI: Informing Design Practices for Explainable AI User Experiences", "short": "XAI Question Bank", "authors": "Q. V. Liao, D. Gruen, S. Miller", "year": "2020", "venue": "CHI", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ1"], "note": "Typologie des questions des utilisateurs. Base possible pour représenter les besoins explicatifs.", "url": "", "summary": "Entretiens avec des praticiens UX. Propose la XAI Question Bank, qui organise les besoins en catégories de questions (how, why, why not, what if, how to be that, data, performance…) reliées à des méthodes XAI.", "rqNote": "Candidat fort pour représenter les besoins explicatifs (RQ1) et pour la correspondance question → méthode (RQ2)."}, {"id": "kaur", "kind": "paper", "domain": "xai", "label": "Interpreting Interpretability: Understanding Data Scientists’ Use of Interpretability Tools", "short": "Kaur", "authors": "H. Kaur et al.", "year": "2020", "venue": "CHI", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ1"], "note": "", "url": "", "summary": "Étude auprès de data scientists : ils font trop confiance à des outils comme SHAP et les interprètent souvent mal.", "rqNote": "Justifie l’adaptation même pour des experts (votre slide 7) et le besoin de vérifier la compréhension réelle."}, {"id": "alufaisan", "kind": "paper", "domain": "xai", "label": "Does Explainable AI Improve Human Decision-Making?", "short": "Alufaisan", "authors": "Y. Alufaisan et al.", "year": "2021", "venue": "AAAI", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Expériences montrant que fournir des explications n’améliore pas forcément la qualité des décisions humaines par rapport à la prédiction seule.", "rqNote": "Argument pour mesurer la compréhension objective, pas seulement la satisfaction."}, {"id": "bucinca", "kind": "paper", "domain": "xai", "label": "To Trust or to Think: Cognitive Forcing Functions Can Reduce Overreliance on AI", "short": "Cognitive forcing", "authors": "Z. Buçinca, M. B. Malaya, K. Z. Gajos", "year": "2021", "venue": "CSCW", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ1"], "note": "", "url": "", "summary": "Les explications peuvent accroître la sur-confiance. Des « fonctions de forçage cognitif » (faire réfléchir l’humain avant de montrer l’IA) la réduisent, au prix d’une expérience jugée moins agréable.", "rqNote": "Éclaire le compromis préférence/performance. La stratégie d’explication peut inclure des questions posées à l’utilisateur (RQ2)."}, {"id": "prefperf", "kind": "paper", "domain": "xai", "label": "Towards Balancing Preference and Performance through Adaptive Personalized Explainability", "short": "Préférence vs performance", "authors": "", "year": "2024", "venue": "HRI", "status": "lu", "pioneer": false, "verify": true, "rq": ["RQ1", "RQ2"], "note": "Pondération λ entre préférence et performance, adaptée à chaque décision.", "url": "", "summary": "Dans un simulateur de conduite où l’IA se trompe 30 % du temps, compare langue naturelle, cartes d’importance et arbres de décision. Adapte la modalité avec un poids λ entre préférence et performance, prédit à chaque décision.", "rqNote": "Idée transposable : arbitrer dynamiquement entre ce que l’utilisateur préfère et ce qui l’aide vraiment (RQ2)."}, {"id": "x6", "kind": "axis", "domain": "xai", "label": "XAI conversationnelle", "short": "XAI conversationnelle", "authors": "", "year": "", "venue": "", "status": "a_lire", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Systèmes où l’explication passe par un dialogue en langage naturel.", "rqNote": "Le cœur de votre état de l’art : situer votre contribution par rapport à ces systèmes."}, {"id": "sokol", "kind": "paper", "domain": "xai", "label": "Conversational Explanations of ML Predictions Through Class-contrastive Counterfactual Statements", "short": "Sokol & Flach", "authors": "K. Sokol, P. Flach", "year": "2018", "venue": "IJCAI", "status": "a_lire", "pioneer": true, "verify": false, "rq": ["RQ2"], "note": "", "url": "", "summary": "Démonstrateur d’explications conversationnelles : l’utilisateur pose des questions et reçoit des contrefactuels contrastifs, en précisant ses contraintes.", "rqNote": "Ancêtre direct de votre vision : le dialogue comme interface d’explication (RQ2)."}, {"id": "rohlfing", "kind": "paper", "domain": "xai", "label": "Explanation as a Social Practice: Toward a Conceptual Framework for the Social Design of AI Systems", "short": "Co-construction", "authors": "K. J. Rohlfing et al.", "year": "2021", "venue": "IEEE TCDS", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ1"], "note": "", "url": "", "summary": "Cadre conceptuel où l’explication est une pratique sociale co-construite entre explainer et explainee, avec un niveau micro (le dialogue) et un niveau macro (rôles, modèle du partenaire).", "rqNote": "Fondement du « modèle du partenaire » à maintenir (RQ1). CoCoXplain et l’étude des LLM co-constructifs s’en réclament."}, {"id": "lakkaraju", "kind": "paper", "domain": "xai", "label": "Rethinking Explainability as a Dialogue: A Practitioner’s Perspective", "short": "Explainability as dialogue", "authors": "H. Lakkaraju et al.", "year": "2022", "venue": "arXiv", "status": "lu", "pioneer": false, "verify": false, "rq": ["RQ1"], "note": "", "url": "", "summary": "Entretiens avec des médecins, des professionnels et des décideurs : ils veulent interroger les modèles en langage naturel, comme un collègue. Propose cinq principes pour concevoir des explications interactives.", "rqNote": "Les cinq principes peuvent servir d’exigences de conception et de grille d’évaluation."}, {"id": "ttm", "kind": "paper", "domain": "xai", "label": "Explaining Machine Learning Models with Interactive Natural Language Conversations Using TalkToModel", "short": "TalkToModel", "authors": "D. Slack et al.", "year": "2023", "venue": "Nature Machine Intelligence", "status": "lu", "pioneer": false, "verify": false, "rq": ["RQ2"], "note": "Parsing vers une grammaire exécutable, positionné après l’entraînement.", "url": "", "summary": "Traduit les questions de l’utilisateur en une grammaire exécutable via un LLM fine-tuné, exécute les opérations XAI et répond en langage naturel. Pour classifieurs tabulaires.", "rqNote": "Baseline principale pour « Interpréter → Exécuter → Répondre ». Ne modélise pas l’utilisateur (manque RQ1)."}, {"id": "interrolang", "kind": "paper", "domain": "xai", "label": "InterroLang: Exploring NLP Models and Datasets through Dialogue-based Explanations", "short": "InterroLang", "authors": "N. Feldhus et al.", "year": "2023", "venue": "Findings of EMNLP", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ2"], "note": "", "url": "", "summary": "Transpose l’approche TalkToModel aux modèles de NLP (classification de texte), avec attribution, contrefactuels et rationales, et une étude utilisateur.", "rqNote": "Montre l’extension à un autre type de données : utile pour décider du périmètre."}, {"id": "convxai", "kind": "paper", "domain": "xai", "label": "ConvXAI: Delivering Heterogeneous AI Explanations via Conversations", "short": "ConvXAI", "authors": "H. Shen et al.", "year": "2023", "venue": "CSCW Companion", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ2"], "note": "", "url": "", "summary": "Système conversationnel qui combine plusieurs types d’explications pour l’aide à la rédaction scientifique ; étudie des besoins variés selon les utilisateurs.", "rqNote": "Illustre le choix de la méthode selon la question et l’utilisateur (RQ2)."}, {"id": "llmcheckup", "kind": "paper", "domain": "xai", "label": "LLMCheckup: Conversational Examination of LLMs via Interpretability Tools and Self-Explanations", "short": "LLMCheckup", "authors": "Q. Wang et al.", "year": "2024", "venue": "HCI+NLP Workshop", "status": "lu", "pioneer": false, "verify": false, "rq": ["RQ2"], "note": "", "url": "", "summary": "Un seul LLM interprète la requête, exécute la tâche, produit des self-explanations et appelle des outils d’interprétabilité, sans fine-tuning. Parsing par décodage guidé ou multi-prompt.", "rqNote": "Montre qu’un LLM unique suffit pour interpréter les questions. Non adaptatif."}, {"id": "xaistories", "kind": "paper", "domain": "xai", "label": "Tell Me a Story! Narrative-Driven XAI with Large Language Models", "short": "XAIStories", "authors": "D. Martens et al.", "year": "2025", "venue": "Decision Support Systems", "status": "lu", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Utilise un LLM pour transformer des valeurs SHAP et des contrefactuels en récits. Les études utilisateurs rapportent une meilleure compréhension perçue.", "rqNote": "Modèle de l’étape « Communicate ». Pas de dialogue ni d’adaptation, et la fidélité des récits reste à garantir (RQ3)."}, {"id": "cocoxplain", "kind": "paper", "domain": "xai", "label": "Towards Co-Constructed Explanations: A Multi-Agent Reasoning-Based Conversational System for Adaptive Explanations", "short": "CoCoXplain", "authors": "D. Mindlin et al.", "year": "2025", "venue": "HAI", "status": "lu", "pioneer": false, "verify": false, "rq": ["RQ1", "RQ2"], "note": "Boucle MAPE-K. Explications précalculées : pas de construction dynamique.", "url": "", "summary": "Boucle MAPE-K avec agents LLM : suit l’engagement (ICAP) et les signaux de compréhension, maintient un modèle utilisateur et planifie le tour suivant. Compréhension perçue meilleure, compréhension objective non.", "rqNote": "Référence la plus proche de RQ1. Sa limite (explications précalculées) est votre ouverture pour RQ2."}, {"id": "x7", "kind": "axis", "domain": "xai", "label": "Évaluation et fidélité", "short": "Évaluation et fidélité", "authors": "", "year": "", "venue": "", "status": "a_lire", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Comment mesurer la fidélité et l’utilité des explications.", "rqNote": "Transversal : la question « comment démontrer que l’utilisateur comprend mieux ? »."}, {"id": "hoffman", "kind": "paper", "domain": "xai", "label": "Metrics for Explainable AI: Challenges and Prospects", "short": "Metrics for XAI", "authors": "R. R. Hoffman et al.", "year": "2018", "venue": "arXiv", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Propose des mesures pour évaluer l’XAI : qualité de l’explication, satisfaction, modèle mental de l’utilisateur, curiosité, confiance, performance de la tâche.", "rqNote": "Boîte à outils pour mesurer le modèle mental de l’utilisateur, au-delà de la satisfaction."}, {"id": "jacovi", "kind": "paper", "domain": "xai", "label": "Towards Faithfully Interpretable NLP Systems", "short": "Jacovi & Goldberg", "authors": "A. Jacovi, Y. Goldberg", "year": "2020", "venue": "ACL", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Clarifie la fidélité : distincte de la plausibilité, graduelle plutôt que binaire. Donne des lignes directrices pour l’évaluer.", "rqNote": "Vocabulaire de base pour formuler RQ3."}, {"id": "hase", "kind": "paper", "domain": "xai", "label": "Evaluating Explainable AI: Which Algorithmic Explanations Help Users Predict Model Behavior?", "short": "Simulatabilité", "authors": "P. Hase, M. Bansal", "year": "2020", "venue": "ACL", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Mesure la simulatabilité (l’utilisateur prédit-il le modèle ?) avant et après des explications LIME, Anchors, prototypes, etc. Peu de méthodes aident nettement.", "rqNote": "Protocole réutilisable pour l’évaluation objective, repris par MaNtLE."}, {"id": "nauta", "kind": "paper", "domain": "xai", "label": "From Anecdotal Evidence to Quantitative Evaluation Methods: A Systematic Review on Evaluating XAI", "short": "Co-12", "authors": "M. Nauta et al.", "year": "2023", "venue": "ACM Computing Surveys", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Revue systématique de l’évaluation XAI. Propose 12 propriétés (Co-12) : exactitude, complétude, cohérence, compacité, contrastivité, etc.", "rqNote": "Grille pour choisir les critères d’évaluation de votre système."}, {"id": "n1", "kind": "axis", "domain": "nlp", "label": "Fondations des modèles", "short": "Fondations des modèles", "authors": "", "year": "", "venue": "", "status": "a_lire", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Architectures et techniques de base des modèles de langue.", "rqNote": "Contexte technique, utile si vous entraînez un modèle explicatif dédié."}, {"id": "transformer", "kind": "paper", "domain": "nlp", "label": "Attention Is All You Need", "short": "Transformer", "authors": "A. Vaswani et al.", "year": "2017", "venue": "NeurIPS", "status": "a_lire", "pioneer": true, "verify": false, "rq": [], "note": "", "url": "", "summary": "Architecture fondée uniquement sur l’attention, sans récurrence, base de tous les LLM actuels.", "rqNote": "Contexte technique."}, {"id": "t5", "kind": "paper", "domain": "nlp", "label": "Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer", "short": "T5", "authors": "C. Raffel et al.", "year": "2020", "venue": "JMLR", "status": "lu", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Formule toutes les tâches de NLP en texte → texte avec un préfixe de tâche, et compare systématiquement les choix de pré-entraînement. Introduit le corpus C4.", "rqNote": "Base de MaNtLE. Utile si vous entraînez un petit modèle explicatif."}, {"id": "distill", "kind": "paper", "domain": "nlp", "label": "Distilling the Knowledge in a Neural Network", "short": "Distillation", "authors": "G. Hinton, O. Vinyals, J. Dean", "year": "2015", "venue": "NIPS Deep Learning Workshop", "status": "lu", "pioneer": true, "verify": false, "rq": [], "note": "", "url": "", "summary": "Entraîne un petit modèle (student) à reproduire les probabilités adoucies d’un gros modèle (teacher).", "rqNote": "Piste pour déployer un module explicatif léger."}, {"id": "n2", "kind": "axis", "domain": "nlp", "label": "Explications en langue naturelle (NLE)", "short": "Explications en langue naturelle (NLE)", "authors": "", "year": "", "venue": "", "status": "a_lire", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Datasets et modèles qui produisent des justifications textuelles.", "rqNote": "Montre les formats d’explication textuelle et leurs limites (RQ3)."}, {"id": "esnli", "kind": "paper", "domain": "nlp", "label": "e-SNLI: Natural Language Inference with Natural Language Explanations", "short": "e-SNLI", "authors": "O.-M. Camburu et al.", "year": "2018", "venue": "NeurIPS", "status": "lu", "pioneer": true, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Ajoute des explications humaines à SNLI et entraîne des modèles « prédire puis expliquer » et « expliquer puis prédire ». Les explications générées restent de qualité moyenne et transfèrent mal.", "rqNote": "Pionnier des NLE supervisées. Montre la difficulté d’obtenir des explications de bonne qualité par simple entraînement."}, {"id": "cose", "kind": "paper", "domain": "nlp", "label": "Explain Yourself! Leveraging Language Models for Commonsense Reasoning", "short": "CoS-E", "authors": "N. F. Rajani et al.", "year": "2019", "venue": "ACL", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Collecte des explications humaines pour CommonsenseQA. Le modèle CAGE génère une explication puis s’en sert pour répondre, ce qui améliore la précision.", "rqNote": "Exemple d’explication utilisée comme raisonnement ; sa fidélité a ensuite été discutée."}, {"id": "makeup", "kind": "paper", "domain": "nlp", "label": "Make Up Your Mind! Adversarial Generation of Inconsistent Natural Language Explanations", "short": "Make Up Your Mind!", "authors": "O.-M. Camburu et al.", "year": "2020", "venue": "ACL", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Attaque adverse montrant que des modèles NLE peuvent produire des explications incohérentes entre elles pour des entrées voisines.", "rqNote": "Test de cohérence à intégrer à la vérification (RQ3)."}, {"id": "teachme", "kind": "paper", "domain": "nlp", "label": "Teach Me to Explain: A Review of Datasets for Explainable NLP", "short": "Teach Me to Explain", "authors": "S. Wiegreffe, A. Marasović", "year": "2021", "venue": "NeurIPS Datasets & Benchmarks", "status": "a_lire", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Revue des datasets d’explications en NLP. Distingue surlignages, explications libres et explications structurées.", "rqNote": "Vocabulaire des formats d’explication, pour choisir le format de sortie."}, {"id": "mariotti", "kind": "paper", "domain": "nlp", "label": "Towards Harnessing Natural Language Generation to Explain Black-box Models", "short": "Mariotti", "authors": "E. Mariotti et al.", "year": "2020", "venue": "NL4XAI Workshop", "status": "lu", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Panorama des approches de génération d’explications textuelles (templates, génération de bout en bout) et des problèmes d’évaluation. Défend le dialogue explicatif.", "rqNote": "Montre la limite des templates et l’absence de métriques consensuelles (RQ3)."}, {"id": "cambria", "kind": "paper", "domain": "nlp", "label": "A Survey on XAI and Natural Language Explanations", "short": "Survey NLE", "authors": "E. Cambria et al.", "year": "2023", "venue": "Information Processing & Management", "status": "lu", "pioneer": false, "verify": false, "rq": ["RQ1", "RQ3"], "note": "", "url": "", "summary": "Survey de 70 travaux d’XAI avec explications en langue naturelle, organisé en feuille de route : contexte, génération de l’explication, génération du message.", "rqNote": "Sa feuille de route recoupe votre pipeline ; utile pour structurer la section Related Work."}, {"id": "mantle", "kind": "paper", "domain": "nlp", "label": "MaNtLE: Model-agnostic Natural Language Explainer", "short": "MaNtLE", "authors": "R. R. Menon et al.", "year": "2023", "venue": "EMNLP", "status": "lu", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "Règles en langue naturelle à partir de 10 à 12 exemples. Plus fidèle que LIME à budget d’appels limité.", "url": "", "summary": "Modèle T5 entraîné sur 200 000 tâches synthétiques pour énoncer une règle en langue naturelle à partir de 10 à 12 exemples étiquetés par un classifieur. Plus fidèle que LIME à budget d’appels limité, et aide les utilisateurs à prédire le modèle.", "rqNote": "Alternative aux attributions pour des explications de groupe (RQ2). Ses difficultés avec les conjonctions et négations limitent la fidélité (RQ3)."}, {"id": "situated", "kind": "paper", "domain": "nlp", "label": "Situated Natural Language Explanations", "short": "Situated NLE", "authors": "", "year": "2024", "venue": "ACL", "status": "lu", "pioneer": false, "verify": true, "rq": ["RQ1", "RQ3"], "note": "Prompts « busy » / « detailed » : adapter l’explication à l’audience.", "url": "", "summary": "Les explications doivent être adaptées à l’audience. Compare des prompts « busy » et « detailed » et mesure longueur, diversité, concrétude, persuasion. Les grands modèles s’adaptent mieux.", "rqNote": "Moyen léger d’adapter la forme (RQ3) ; ne traite pas la fidélité."}, {"id": "n3", "kind": "axis", "domain": "nlp", "label": "Fidélité des explications de LLM", "short": "Fidélité des explications de LLM", "authors": "", "year": "", "venue": "", "status": "a_lire", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Les explications produites par les LLM reflètent-elles leur vrai raisonnement ?", "rqNote": "Raison principale d’ancrer les réponses sur des preuves calculées (RQ3)."}, {"id": "cot", "kind": "paper", "domain": "nlp", "label": "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models", "short": "Chain-of-Thought", "authors": "J. Wei et al.", "year": "2022", "venue": "NeurIPS", "status": "a_lire", "pioneer": true, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Montre que demander des étapes de raisonnement intermédiaires améliore fortement les performances des grands modèles sur des tâches de raisonnement.", "rqNote": "Point de départ des débats sur la fidélité des explications des LLM (RQ3)."}, {"id": "turpin", "kind": "paper", "domain": "nlp", "label": "Language Models Don’t Always Say What They Think: Unfaithful Explanations in CoT Prompting", "short": "Turpin", "authors": "M. Turpin et al.", "year": "2023", "venue": "NeurIPS", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Montre que des explications chain-of-thought rationalisent des réponses influencées par des biais (par exemple l’ordre des options) sans jamais mentionner ces biais.", "rqNote": "Raison de ne pas se fier aux self-explanations du LLM et d’ancrer les réponses sur des preuves calculées (RQ3)."}, {"id": "atanasova", "kind": "paper", "domain": "nlp", "label": "Faithfulness Tests for Natural Language Explanations", "short": "Tests de fidélité", "authors": "P. Atanasova et al.", "year": "2023", "venue": "ACL", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "Test contrefactuel repris par SR-NLE.", "url": "", "summary": "Propose deux tests de fidélité des NLE : un test contrefactuel (insérer des mots qui changent la prédiction et vérifier qu’ils figurent dans l’explication) et un test de reconstruction de l’entrée.", "rqNote": "Test automatique directement réutilisable dans votre évaluation (RQ3)."}, {"id": "lanham", "kind": "paper", "domain": "nlp", "label": "Measuring Faithfulness in Chain-of-Thought Reasoning", "short": "Lanham", "authors": "T. Lanham et al.", "year": "2023", "venue": "arXiv", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Modifie le chain-of-thought (troncature, erreurs, paraphrase) pour voir si la réponse en dépend. La dépendance varie selon les tâches et diminue parfois avec la taille du modèle.", "rqNote": "Méthode d’intervention pour vérifier si une explication influence vraiment la réponse (RQ3)."}, {"id": "madsen", "kind": "paper", "domain": "nlp", "label": "Are Self-Explanations from Large Language Models Faithful?", "short": "Self-explanations", "authors": "A. Madsen, S. Chandar, S. Reddy", "year": "2024", "venue": "Findings of ACL", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ3"], "note": "", "url": "", "summary": "Évalue la fidélité de self-explanations (contrefactuelles, importance, masquage) par des tests d’auto-cohérence. Le résultat dépend fortement du modèle et de la tâche.", "rqNot eedback et suggestions pour la raffiner.", "rqNote": "Variante de vérification à deux modèles ; à comparer à SR-NLE (RQ3)."}, {"id": "srnle", "kind": "paper", "domain": "nlp", "label": "Self-Critique and Refinement for Faithful Natural Language Explanations", "short": "SR-NLE", "authors": "", "year": "2025", "venue": "", "status": "lu", "pioneer": false, "verify": true, "rq": ["RQ3"], "note": "Feedback par mots importants (IWF) : unfaithfulness de 54,8 % à 36 %.", "url": "", "summary": "Le modèle critique et raffine sa propre explication post-hoc. Le feedback sur les mots importants (IWF, par attention ou Integrated Gradients) réduit l’infidélité d’environ 55 % à 36 %.", "rqNote": "Montre comment injecter une attribution calculée pour rendre une NLE plus fidèle : modèle direct pour RQ3."}, {"id": "n5", "kind": "axis", "domain": "nlp", "label": "LLM comme explainers d’autres modèles", "short": "LLM comme explainers d’autres modèles", "authors": "", "year": "", "venue": "", "status": "a_lire", "pioneer": false, "verify": false, "rq": [], "note": "", "url": "", "summary": "Utiliser un LLM pour expliquer un autre modèle.", "rqNote": "Faisabilité et limites d’un LLM placé entre le modèle et l’utilisateur (RQ2, RQ3)."}, {"id": "kroeger", "kind": "paper", "domain": "nlp", "label": "Are Large Language Models Post Hoc Explainers?", "short": "LLM post-hoc", "authors": "N. Kroeger et al.", "year": "2023", "venue": "arXiv", "status": "a_lire", "pioneer": false, "verify": false, "rq": ["RQ2", "RQ3"], "note": "", "url": "", "summary": "Évalue si un LLM peut identifier les variables importantes d’un autre modèle par apprentissage en contexte sur des exemples perturbés. Résultats comparables à certaines méthodes post-hoc sur données tabulaires.", "rqNote": "Faisabilité d’un LLM explainer, mais fidélité à contrôler (RQ2, RQ3)."}, {"id": "zytek", "kind": "paper", "domain": "nlp", "label": "LLMs for XAI: Future Directions for Explaining Explanations", "short": "LLMs for XAI", "authors   if(root){root.fx=0;root.fy=0;}
  const sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(l=>l.rel==='contient'?(dist[l.target.kind]||120):200).strength(l=>l.rel==='contient'?.8:.02))
    .force('charge',d3.forceManyBody().strength(d=>-R[d.kind]*30))
    .force('collide',d3.forceCollide(d=>R[d.kind]+(d.kind==='paper'?30:44)))
    .stop();
  for(let i=0;i<350;i++)sim.tick();
  nodes.forEach(n=>{n.x=Math.round(n.x);n.y=Math.round(n.y);delete n.vx;delete n.vy;delete n.fx;delete n.fy;delete n.index;});
}

/* ---------- filters ---------- */
function matches(n){
  if(n.kind==='root')return true;
  if(!F.doms.has(n.domain))return false;
  if(n.kind!=='paper')return !(F.q||F.rqs.size||F.status!=='all'||F.pio||F.ver)||true;
  if(F.rqs.size&&!n.rq.some(r=>F.rqs.has(r)))return false;
  if(F.status!=='all'&&n.status!==F.status)return false;
  if(F.pio&&!n.pioneer)return false;
  if(F.ver&&!n.verify)return false;
  if(F.q){const h=(n.label+' '+n.short+' '+n.authors+' '+n.venue+' '+n.year+' '+(n.summary||'')+' '+(n.rqNote||'')+' '+(n.note||'')).toLowerCase();if(!h.includes(F.q))return false;}
  return true;
}
function isActiveFilter(){return !!(F.q||F.rqs.size||F.status!=='all'||F.pio||F.ver);}

/* ---------- render ---------- */
let svg,vp,zoom,gE,gN,kNow=1;
function initSvg(){
  svg=d3.select('#graph');vp=d3.select('#vp');gE=d3.select('#gE');gN=d3.select('#gN');
  zoom=d3.zoom().scaleExtent([.15,3.5]).on('zoom',ev=>{vp.attr('transform',ev.transform);kNow=ev.transform.k;
    svg.classed('far',kNow<.95).classed('near',kNow>=1.25);});
  svg.call(zoom).on('dblclick.zoom',null);
  svg.on('click',ev=>{if(ev.target===svg.node()){if(linkMode){return;}select(null);}});
  $('zIn').onclick=()=>svg.transition().duration(200).call(zoom.scaleBy,1.3);
  $('zOut').onclick=()=>svg.transition().duration(200).call(zoom.scaleBy,1/1.3);
  $('zFit').onclick=()=>fit(true);
}
function fit(anim){
  const ns=state.nodes; if(!ns.length)return;
  const xs=ns.map(n=>n.x),ys=ns.map(n=>n.y),pad=60;
  const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  const box=$('graph').getBoundingClientRect();const w=box.width||800,h=box.height||600;
  const k=Math.min(w/(x1-x0),h/(y1-y0),1.4);
  const t=d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2).scale(k);
  (anim?svg.transition().duration(350):svg).call(zoom.transform,t);
}
function nodeColor(n){return (DOM[n.domain]||DOM.root).c;}
function render(){
  byId=new Map(state.nodes.map(n=>[n.id,n]));
  state.edges=state.edges.filter(e=>byId.has(e.source)&&byId.has(e.target));
  const es=gE.selectAll('g.edge').data(state.edges,d=>d.id);
  es.exit().remove();
  const ee=es.enter().append('g');
  ee.append('line').attr('class','vis');ee.append('line').attr('class','hit');ee.append('text');
  ee.on('click',(ev,d)=>{ev.stopPropagation();if(!linkMode)select({type:'edge',id:d.id});})
    .on('mouseenter',(ev,d)=>{hot={type:'edge',id:d.id};classes();}).on('mouseleave',()=>{hot=null;classes();});
  const em=ee.merge(es);
  em.attr('class',d=>'edge rel-'+d.rel);
  em.select('text').text(d=>REL[d.rel]||d.rel);
  const ns=gN.selectAll('g.node').data(state.nodes,d=>d.id);
  ns.exit().remove();
  const ne=ns.enter().append('g');
  ne.append('circle').attr('class','ring');ne.append('circle').attr('class','body');ne.append('text');
  ne.on('click',(ev,d)=>{ev.stopPropagation();onNodeClick(d);})
    .on('mouseenter',(ev,d)=>{hot={type:'node',id:d.id};classes();}).on('mouseleave',()=>{hot=null;classes();})
    .call(d3.drag().clickDistance(4)
      .on('start',function(ev){if(readOnly)return;d3.select(this).raise();})
      .on('drag',function(ev,d){if(readOnly)return;d.x=Math.round(ev.x);d.y=Math.round(ev.y);d._moved=true;positions();})
      .on('end',function(ev,d){if(d._moved){delete d._moved;markDirty();}}));
  const nm=ne.merge(ns);
  nm.attr('class',d=>'node k-'+d.kind+(d.verify?' verify':''));
  nm.select('circle.body').attr('r',d=>R[d.kind])
    .attr('fill',d=>{const c=nodeColor(d);if(d.kind!=='paper')return c;return d.status==='lu'?c:(d.status==='en_cours'?'url(#half-'+d.domain+')':'var(--surface)');})
    .attr('stroke',d=>d.kind==='paper'?nodeColor(d):'var(--surface)');
  nm.select('circle.ring').attr('r',d=>R[d.kind]+4.5).attr('stroke',d=>d.pioneer?nodeColor(d):'none');
  nm.select('text').text(d=>d.kind==='paper'?nodeName(d):(d.short&&d.kind==='root'?d.short:d.label))
    .attr('dy',d=>d.kind==='domain'?-(R.domain+9):R[d.kind]+(d.kind==='paper'?13:17));
  positions();classes();stats();
}
function ensureHalfPatterns(){
  const defs=d3.select('#graph defs');
  ['xai','nlp','dlg'].forEach(k=>{if(document.getElementById('half-'+k))return;
    const g=defs.append('linearGradient').attr('id','half-'+k).attr('x1','0').attr('x2','0').attr('y1','0').attr('y2','1');
    g.append('stop').attr('offset','50%').attr('stop-color','var(--surface)');g.append('stop').attr('offset','50%').attr('stop-color',DOM[k].c);});
}
function positions(){
  gN.selectAll('g.node').attr('transform',d=>`translate(${d.x},${d.y})`);
  gE.selectAll('g.edge').each(function(d){
    const s=byId.get(d.source),t=byId.get(d.target);if(!s||!t)return;
    const dx=t.x-s.x,dy=t.y-s.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
    const a=R[s.kind]+2,b=R[t.kind]+(d.rel==='contient'?2:6);
    const x1=s.x+ux*a,y1=s.y+uy*a,x2=t.x-ux*b,y2=t.y-uy*b;
    const g=d3.select(this);
    g.selectAll('line').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2);
    g.select('text').attr('x',(x1+x2)/2).attr('y',(y1+y2)/2-4).attr('text-anchor','middle');
  });
}
function classes(){
  const act=isActiveFilter(), sid=sel&&sel.type==='node'?sel.id:null, eid=sel&&sel.type==='edge'?sel.id:null;
  const hn=hot&&hot.type==='node'?hot.id:null, he=hot&&hot.type==='edge'?hot.id:null;
  const ok=new Map(state.nodes.map(n=>[n.id,matches(n)]));
  gN.selectAll('g.node')
    .classed('dim',d=>{if(!ok.get(d.id))return true;if(act&&d.kind!=='paper'&&d.kind!=='root'){return false;}return false;})
    .classed('is-sel',d=>d.id===sid).classed('is-hot',d=>d.id===hn).classed('is-from',d=>linkFrom===d.id)
    .classed('is-match',d=>act&&d.kind==='paper'&&ok.get(d.id));
  gE.selectAll('g.edge')
    .classed('dim',d=>!ok.get(d.source)||!ok.get(d.target)||(act&&d.rel==='contient'&&byId.get(d.target).kind==='paper'&&!ok.get(d.target)))
    .classed('is-sel',d=>d.id===eid).classed('is-hot',d=>d.id===he||(hn&&(d.source===hn||d.target===hn))||(sid&&(d.source===sid||d.target===sid)))
    .each(function(d){const l=d3.select(this).select('line.vis');const hl=this.classList.contains('is-sel')||this.classList.contains('is-hot');
      l.attr('marker-end',d.rel==='contient'?null:(hl?'url(#arrs)':(d.rel==='critique'?'url(#arrc)':'url(#arr)')));});
}
function stats(){
  const p=state.nodes.filter(n=>n.kind==='paper');
  const c=s=>p.filter(n=>n.status===s).length;
  $('stats').textContent=`${p.length} articles : ${c('lu')} lus, ${c('en_cours')} en cours, ${c('a_lire')} à lire`;
}

function onNodeClick(d){
  if(linkMode){
    if(!linkFrom){linkFrom=d.id;$('linkHint').textContent='Source : '+nodeName(d)+'. Cliquez maintenant sur la cible.';classes();return;}
    if(linkFrom===d.id)return;

    state.edges.push(e);stopLink();render();select({type:'edge',id:e.id});markDirty();toast('Lien créé');return;

}

  const box=$('graph').getBoundingClientRect();const t=d3.zoomTransform($('graph'));

  if(!art){state.savedAt=new Date().toISOString();blobDownload('data.json',JSON.stringify(state,null,2));
    try{localStorage.setItem(DRAFT,JSON.stringify({base:state.savedAt,core:core()}));}catch(e){}
    dirty=false;b.disabled=true;b.textContent='Exporté';toast('data.json téléchargé : remplacez celui du dépôt partagé.');return;}
  const prev=state.savedAt;state.savedAt=new Date().toISOString();
  b.disabled=true;b.textContent='Enregistrement…';
  try{await art.publish(buildHtml());dirty=false;b.textContent='Enregistré';try{localStorage.removeItem(DRAFT);}catch(e){}toast('Carte enregistrée');}
  catch(e){state.savedAt=prev;const c=e&&e.code;
    if(c==='conflict'){toast('Quelqu’un a enregistré entre-temps : la carte se recharge. Votre brouillon reste dans ce navigateur.');}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared'){setReadOnly();toast('Cette vue est en lecture seule.');}
    else if(c==='rate_limited'){b.disabled=false;b.textContent='Enregistrer';toast('Trop d’enregistrements rapprochés : réessayez dans un moment.');}
    else if(c==='too_large'){b.disabled=false;b.textContent='Enregistrer';toast('La carte dépasse la taille maximale.');}
    else{b.disabled=false;b.textContent='Enregistrer';toast('Échec de l’enregistrement. Vos changements restent dans ce navigateur.');}}
}
function setReadOnly(){readOnly=true;document.body.classList.add('ro');stopLink();panel();}

/* ---------- export / import ---------- */
function openData(){
  $('dlgText').value=JSON.stringify({nodes:state.nodes,edges:state.edges},null,2);$('dlgText').readOnly=false;
  $('dlg').showModal();
  downloadsP.then(d=>{$('dlgDl').hidden=false;$('dlgDl').onclick=async()=>{if(!d){blobDownload('carte-lectures.json',$('dlgText').value);return;}try{await d.save({filename:'carte-lectures.json',data:$('dlgText').value});}catch(e){toast('Téléchargement annulé');}};});
}

/* ---------- toolbar ---------- */
function initToolbar(){
  const dc=$('domChips');
  ['xai','nlp','dlg'].forEach(k=>{const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed','true');
    b.innerHTML=`<span class="dot" style="background:${DOM[k].c}"></span>${DOM[k].name}`;
    b.onclick=()=>{F.doms.has(k)?F.doms.delete(k):F.doms.add(k);b.setAttribute('aria-pressed',F.doms.has(k));classes();};dc.appendChild(b);});
  const rc=$('rqChips');
  Object.entries(RQ).forEach(([k,l])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.title=l;b.setAttribute('aria-pressed','false');b.textContent=k;
    b.onclick=()=>{F.rqs.has(k)?F.rqs.delete(k):F.rqs.add(k);b.setAttribute('aria-pressed',F.rqs.has(k));classes();};rc.appendChild(b);});
  $('q').oninput=e=>{F.q=e.target.value.trim().toLowerCase();classes();};
  $('fStatus').onchange=e=>{F.status=e.target.value;classes();};
  $('fPio').onchange=e=>{F.pio=e.target.checked;classes();};
  $('fVer').onchange=e=>{F.ver=e.target.checked;classes();};
  $('linkRel').innerHTML=opt(REL,'utilise');
  $('btnLink').onclick=()=>linkMode?stopLink():startLink(sel&&sel.type==='node'?sel.id:null);
  $('linkCancel').onclick=stopLink;
  $('btnAdd').onclick=()=>addNode(null);
  $('btnSave').onclick=save;
  $('btnData').onclick=openData;
  $('dlgClose').onclick=()=>$('dlg').close();
  $('dlgCopy').onclick=async()=>{const t=$('dlgText');t.select();try{await navigator.clipboard.writeText(t.value);toast('JSON copié');}catch(e){toast('Sélectionné : copiez avec Ctrl+C ou Cmd+C');}};
  $('dlgImport').onclick=()=>{try{const c=JSON.parse($('dlgText').value);if(!Array.isArray(c.nodes)||!Array.isArray(c.edges))throw 0;
      state.nodes=c.nodes;state.edges=c.edges;if(state.nodes.some(n=>n.x==null))seedLayout();$('dlg').close();select(null);render();fit(true);markDirty();toast('Carte remplacée');}
    catch(e){toast('Ce JSON ne contient pas de listes « nodes » et « edges » valides.');}};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(linkMode)stopLink();else if(sel)select(null);}});
  $('legend').innerHTML=`
   <svg width="18" height="18"><circle cx="9" cy="9" r="6" fill="var(--xai)" stroke="var(--xai)" stroke-width="2"/></svg><span>Lu</span>
   <svg width="18" height="18"><circle cx="9" cy="9" r="6" fill="url(#half-xai)" stroke="var(--xai)" stroke-width="2"/></svg><span>En cours</span>
   <svg width="18" height="18"><circle cx="9" cy="9" r="6" fill="var(--surface)" stroke="var(--xai)" stroke-width="2"/></svg><span>À lire</span>
   <svg width="18" height="18"><circle cx="9" cy="9" r="5" fill="var(--surface)" stroke="var(--xai)" stroke-width="2"/><circle cx="9" cy="9" r="8" fill="none" stroke="var(--xai)" stroke-width="1.3"/></svg><span>Pionnier</span>
   <svg width="18" height="18"><circle cx="9" cy="9" r="6" fill="var(--surface)" stroke="var(--xai)" stroke-width="2" stroke-dasharray="3 2"/></svg><span>À vérifier</span>`;
}

/* ---------- boot ---------- */
function boot(){
  if(typeof d3==='undefined'){$('panel').innerHTML='<h2>Chargement impossible</h2><p>La bibliothèque de dessin du graphe n’a pas pu être chargée. Rechargez la page.</p>';return;}
  initToolbar();initSvg();ensureHalfPatterns();
  start();
}
async function start(){
  if(STANDALONE&&/^https?:/.test(location.protocol)){
    try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(Array.isArray(d.nodes)&&Array.isArray(d.edges))state=d;}}catch(e){}
  }
  if(state.nodes.some(n=>n.x==null))seedLayout();
  render();panel();requestAnimationFrame(()=>fit(false));checkDraft();
}
boot();
})();
</script>
</body>
